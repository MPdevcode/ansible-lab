---
- name: Administrar los servidores Ubuntu del laboratorio
  hosts: docker
  gather_facts: true

  tasks:
    - name: Mostrar el nombre del host
      ansible.builtin.debug:
        msg: "Nombre del servidor: {{ ansible_hostname }}"

    - name: Mostrar el sistema operativo
      ansible.builtin.debug:
        msg: "Sistema operativo: {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Crear el directorio principal del laboratorio
      ansible.builtin.file:
        path: /tmp/ansible-demo
        state: directory
        mode: "0755"

    - name: Crear el archivo info.txt con los datos del servidor
      ansible.builtin.copy:
        dest: /tmp/ansible-demo/info.txt
        content: |
          Servidor: {{ ansible_hostname }}
          Sistema operativo: {{ ansible_distribution }} {{ ansible_distribution_version }}
        mode: "0644"

    - name: Crear los directorios requeridos mediante un loop
      ansible.builtin.file:
        path: "/tmp/ansible-demo/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - logs
        - backup
        - config

    - name: Mostrar mensaje cuando el sistema operativo sea Ubuntu
      ansible.builtin.debug:
        msg: "Este servidor utiliza Ubuntu."
      when: ansible_distribution == "Ubuntu"
